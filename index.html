<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Assisted Humanitarian Delivery Tracking Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 760px;
            margin-bottom: 20px;
            background: #161e2e;
            padding: 12px 24px;
            border-radius: 99px;
            border: 1px solid #232d3f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .dashboard-title {
            font-size: 14px;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .corridor-chip {
            background: #1f2937;
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #374151;
        }

        .refresh-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: #374151;
            color: #ffffff;
        }

        .refresh-btn:active {
            transform: rotate(180deg);
        }

        .split-container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 760px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .panel-frame {
            flex: 1;
            min-width: 320px;
            max-width: 360px;
            height: 640px;
            background: #111827;
            border-radius: 36px;
            border: 6px solid #1f293d;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 2px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        .driver-panel {
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .volunteer-panel {
            justify-content: space-between;
            text-align: center;
        }

        .view-title {
            font-size: 16px;
            font-weight: 700;
            color: #9ca3af;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.15);
            animation: pulse 2.5s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .check-in-btn {
            position: relative;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: 4px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.15s ease;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
            user-select: none;
        }

        .check-in-btn:active {
            transform: scale(0.94);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-text-main {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .btn-text-sub {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.85;
        }

        .driver-footer {
            width: 100%;
            background: #1f2937;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #374151;
        }

        .driver-subtext {
            color: #f3f4f6;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .driver-last-checkin {
            color: #9ca3af;
            font-size: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .status-badge.arriving {
            background: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .status-badge.arriving .status-dot {
            background: #f59e0b;
        }

        .status-badge.arrived {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .status-badge.arrived .status-dot {
            background: #3b82f6;
        }

        .eta-card {
            background: #1f2937;
            padding: 28px 16px;
            border-radius: 24px;
            border: 1px solid #374151;
            margin: 15px 0;
        }

        .eta-time {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .eta-label {
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .updated-text {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .share-btn {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .share-btn:hover {
            background: #374151;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #374151;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            border: 1px solid #4b5563;
            z-index: 100;
        }

        .toast.show {
            bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <span class="dashboard-title">Humanitarian Tracker</span>
        <div class="status-right">
            <span class="corridor-chip">Corridor 4</span>
            <button class="refresh-btn" onclick="manualRefresh()" title="Refresh Status">↻</button>
        </div>
    </div>

    <div class="split-container">
        <!-- DRIVER PANEL -->
        <div class="panel-frame driver-panel">
            <div class="view-title">Driver Control</div>
            
            <div class="btn-wrapper">
                <div class="pulse-ring"></div>
                <button class="check-in-btn" onclick="performCheckIn()">
                    <span class="btn-text-main">I am safe.</span>
                    <span class="btn-text-sub">I am moving.</span>
                </button>
            </div>

            <div class="driver-footer">
                <div class="driver-subtext">Tap when passing a checkpoint</div>
                <div class="driver-last-checkin" id="driverLastCheckin">Last check-in: 42 min ago</div>
            </div>
        </div>

        <!-- VOLUNTEER PANEL -->
        <div class="panel-frame volunteer-panel">
            <div>
                <div class="view-title">Volunteer Display</div>
                <div id="statusBadge" class="status-badge">
                    <span class="status-dot"></span>
                    <span id="badgeText">Corridor clear</span>
                </div>
            </div>

            <div class="eta-card">
                <div class="eta-time" id="etaDisplay">5h 0m 0s</div>
                <div class="eta-label">Estimated Arrival</div>
            </div>

            <div>
                <div class="updated-text" id="volunteerUpdatedText">Updated 6 min ago</div>
                <button class="share-btn" onclick="shareToDisplay()">
                    <span>Share to Display</span>
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Timestamp Sent</div>

    <script>
        let totalSeconds = 18000; // 5 hours default
        let timerInterval = null;

        const channel = new BroadcastChannel('delivery_tracker_channel');

        channel.onmessage = (event) => {
            if (event.data.type === 'SYNC_TIME') {
                totalSeconds = event.data.seconds;
                updateETADisplay();
                startLiveCountdown();
                document.getElementById('volunteerUpdatedText').innerText = 'Updated Just now';
                document.getElementById('driverLastCheckin').innerText = 'Last check-in: Just now';
            } else if (event.data.type === 'REFRESH_REQUEST') {
                channel.postMessage({ type: 'SYNC_TIME', seconds: totalSeconds });
            }
        };

        function updateETADisplay() {
            const etaDisplay = document.getElementById('etaDisplay');
            const badge = document.getElementById('statusBadge');
            const badgeText = document.getElementById('badgeText');

            if (totalSeconds <= 0) {
                etaDisplay.innerText = '0s';
                badgeText.innerText = 'Arrived';
                badge.className = 'status-badge arrived';
                return;
            }

            const hours = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;

            if (hours > 0) {
                etaDisplay.innerText = hours + 'h ' + mins + 'm ' + secs + 's';
            } else if (mins > 0) {
                etaDisplay.innerText = mins + 'm ' + secs + 's';
            } else {
                etaDisplay.innerText = secs + 's';
            }

            if (totalSeconds <= 3600) {
                badgeText.innerText = 'Arriving soon';
                badge.className = 'status-badge arriving';
            } else {
                badgeText.innerText = 'Corridor clear';
                badge.className = 'status-badge';
            }
        }

        function startLiveCountdown() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateETADisplay();
                } else {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function performCheckIn() {
            if (totalSeconds > 0) {
                const currentHours = Math.floor(totalSeconds / 3600);
                
                if (currentHours > 0) {
                    totalSeconds = ((currentHours - 1) * 3600) + (59 * 60) + 59;
                } else {
                    totalSeconds = 0;
                }
            }

            document.getElementById('driverLastCheckin').innerText = 'Last check-in: Just now';
            document.getElementById('volunteerUpdatedText').innerText = 'Updated Just now';

            updateETADisplay();
            startLiveCountdown();

            channel.postMessage({ type: 'SYNC_TIME', seconds: totalSeconds });

            if (totalSeconds > 0) {
                showToast('Timestamp check-in sent');
            } else {
                showToast('Vehicle has arrived');
            }
        }

        function manualRefresh() {
            channel.postMessage({ type: 'REFRESH_REQUEST' });
            updateETADisplay();
            showToast('Time & status refreshed');
        }

        function shareToDisplay() {
            showToast('Shared to public display screen');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        updateETADisplay();
        startLiveCountdown();
    </script>
</body>
</html>
